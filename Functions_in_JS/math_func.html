<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Function</title>
</head>
<body>
  
  <script>
    //Max Value
    console.log(Math.max(10,23,1,21,45,22,32,100,101,21,54,98));

    //Min value
    console.log(Math.min(21,65,43,98,27,1,-4,910));

    let num=5.9;
    //floor value
    console.log(Math.floor(num));

//ceil value
console.log(Math.ceil(num));

r=Math.ceil(Math.random()*255);
g=Math.ceil(Math.random()*255);
b=Math.ceil(Math.random()*255);
console.log(r);
console.log(g);
console.log(b);
document.body.style.background=`rgb(${r},${g},${b})`;

//extra gpt functions
//Basic Math functions

console.log("Extra Functions");
console.log("Basic Math functions");
console.log(Math.round(4.6));
console.log(Math.floor(4.9));
console.log(Math.ceil(9.1));
console.log(Math.trunc(4.9));
console.log(Math.abs(-10));

let arr=[10,20,30,43,21,32,43];
console.log(Math.max(...arr));
console.log(Math.min(...arr));

//Power and square root
console.log("Power and square root");
console.log(Math.pow(2,3));
console.log(2**3);
console.log(Math.sqrt(25));

//Random numbers
console.log("Random numbers");
console.log(" To generate a random integer from 1 to 10:");
let a=Math.floor(Math.random()*10)+1;
console.log(a);

//More useful Math functions
console.log("More useful Math functions");
console.log(Math.sign(-8));
console.log(Math.cbrt(27));
console.log(Math.hypot(3,4));
console.log(Math.exp(2));

//Trignometric functios
console.log("Trigonometric functions");
console.log(Math.sin(0));
console.log(Math.cos(0));
console.log(Math.tan(45));

// Useful constants
console.log("Useful constants");
console.log(Math.PI);
console.log(Math.E);


  </script>
</body>
</html>
