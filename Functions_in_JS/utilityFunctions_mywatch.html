<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utility Functions - Live Clock</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #070914;
      --panel: rgba(19, 23, 45, 0.85);
      --border: rgba(164, 155, 255, 0.18);
      --purple: #a78bfa;
      --cyan: #4de8ff;
      --text: #f5f5ff;
      --muted: #929ab8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 10% 10%, #5728a52b, transparent 40%),
        radial-gradient(ellipse at 90% 90%, #007d9b25, transparent 40%),
        linear-gradient(135deg, #070914, #0d1022 55%, #080b18);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      text-align: center;
    }

    .clock-card {
      position: relative;
      padding: 45px 30px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .clock-label {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    /* Your original #Time element styled */
    #Time {
      font-family: 'Space Mono', monospace;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 700;
      letter-spacing: -1px;
      color: #fff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px rgba(167, 139, 250, 0.6), 0 0 35px rgba(139, 92, 246, 0.3);
      word-break: break-all;
    }

    .clock-note {
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="clock-card">
      <div class="clock-label">High-Precision Temporal Node</div>
      <div id="Time">00:00:00:000</div>
      <div class="clock-note">RUNNING 1MS REFRESH INTERVAL</div>
    </div>
  </div>

  <script>
    //setTimeout
    setTimeout(()=>console.log(`this is settimeout function output`),5000);

    //settimeinterval
    setInterval(()=>console.log("hello"),10000);

    const clock = () => {
      let d = new Date();
      let h = d.getHours();
      let m = d.getMinutes();
      let s = d.getSeconds();
      let ms = d.getMilliseconds();

      document.getElementById('Time').innerHTML = `${h}:${m}:${s}:${ms}`;
    }

    //clock()
    setInterval(clock, 1);
  </script>
</body>
</html>
